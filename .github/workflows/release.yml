name: Build Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'minesweeper-py/**'
      - '.github/workflows/release.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build executable
        shell: powershell
        working-directory: minesweeper-py
        run: |
          .\build_release.ps1
          if (-not (Test-Path -LiteralPath '.\扫雷.exe')) {
            throw '扫雷.exe was not produced.'
          }

      - name: Generate tag
        shell: bash
        run: |
          TAG="v$(date +'%Y.%m.%d-%H%M')-${GITHUB_RUN_NUMBER}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          git tag "$TAG"
          git push origin "$TAG"

      - name: Upload release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: "扫雷 ${{ env.TAG }}"
          generate_release_notes: true
          files: minesweeper-py/扫雷.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
